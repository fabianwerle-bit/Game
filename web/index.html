<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Letzte Ausfahrt</title>
<style>
:root{--bone:#d9d0b4;--ink:#0b0c0d;--bs:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e8e6df}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.6s;z-index:3}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
#face{position:fixed;inset:0;width:100%;height:100%;display:none;pointer-events:none;z-index:4}
.lb{position:fixed;left:0;right:0;height:0;background:#000;z-index:2;transition:height .7s;pointer-events:none}#lbT{top:0}#lbB{bottom:0}
body.cine .lb{height:13vh}
body.cine #hud,body.cine #inv,body.cine .btn,body.cine #cross,body.cine #hint{display:none!important}
#hud{position:fixed;left:max(14px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));font-size:12px;letter-spacing:.06em;text-shadow:0 1px 3px #000;pointer-events:none;display:none;max-width:46vw}
#hud .row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
#hud .lbl{width:54px;opacity:.6;text-transform:uppercase;font-size:9px;letter-spacing:.16em}
.bar{width:104px;height:3px;background:rgba(217,208,180,.16);overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--bone)}
#day{font-size:13px;font-weight:500;margin-bottom:9px;letter-spacing:.2em;text-transform:uppercase}
#obj{opacity:.75;font-size:11.5px;line-height:1.4;margin-top:6px;font-style:italic;letter-spacing:.02em}
#msg{position:fixed;left:50%;top:17%;transform:translateX(-50%);max-width:80vw;text-align:center;font-size:17px;line-height:1.45;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .8s;pointer-events:none;font-style:italic;z-index:2}
#sub{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);max-width:78vw;text-align:center;font-size:16px;line-height:1.4;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .5s;pointer-events:none;z-index:2;color:var(--bone);background:rgba(0,0,0,.45);padding:5px 14px}
#hint{position:fixed;left:50%;bottom:31%;transform:translateX(-50%);font-size:12px;opacity:.8;text-shadow:0 1px 4px #000;pointer-events:none;letter-spacing:.08em}
#cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none;display:none}
.btn{position:fixed;min-width:66px;height:66px;padding:0 10px;border-radius:50%;color:#efe9d6;font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;line-height:1.25;display:none;align-items:center;justify-content:center;text-align:center;
 background:radial-gradient(circle at 50% 32%,rgba(70,72,70,.45),rgba(10,11,12,.74) 72%);border:1px solid rgba(217,208,180,.42);
 box-shadow:0 0 0 4px rgba(10,12,13,.3),0 6px 18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14),inset 0 -8px 14px rgba(0,0,0,.35);text-shadow:0 1px 2px #000;transition:transform .08s,background .12s,border-color .12s}
.btn:active,.btn.on{transform:scale(.93);border-color:var(--bone);background:radial-gradient(circle at 50% 40%,rgba(217,208,180,.4),rgba(40,40,36,.75) 75%)}
#bAct{right:max(22px,env(safe-area-inset-right));bottom:96px;min-width:92px;width:92px;height:92px;font-size:10px;letter-spacing:.09em;padding:0 6px;border-color:rgba(217,208,180,.7)}
#bAct::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1px solid rgba(217,208,180,.2);pointer-events:none}
#bFire{right:calc(max(22px,env(safe-area-inset-right)) + 110px);bottom:100px;min-width:78px;height:78px;color:#e9c3b8;border-color:rgba(160,60,44,.8);
 background:radial-gradient(circle at 50% 32%,rgba(110,36,28,.55),rgba(24,8,6,.8) 72%);padding-top:38px;font-size:9px}
#bFire::before{content:"";position:absolute;left:50%;top:15px;width:24px;height:24px;margin-left:-12px;border-radius:50%;border:1.5px solid #e9c3b8;
 background:linear-gradient(#e9c3b8,#e9c3b8) center/1.5px 100% no-repeat,linear-gradient(#e9c3b8,#e9c3b8) center/100% 1.5px no-repeat;opacity:.9}
#bBack{right:calc(max(22px,env(safe-area-inset-right)) + 102px);bottom:222px;font-size:9px;min-width:68px;height:68px}
#bRadio{right:calc(max(22px,env(safe-area-inset-right)) + 184px);bottom:222px;font-size:9px;min-width:62px;height:62px}
#bGas,#bBrk{border-radius:16px 16px 12px 12px;overflow:hidden;align-items:flex-end;padding-bottom:10px;background:linear-gradient(rgba(60,62,60,.5),rgba(10,11,12,.8))}
#bGas::before,#bBrk::before{content:"";position:absolute;left:9px;right:9px;top:9px;bottom:30px;border-radius:8px;background:repeating-linear-gradient(0deg,rgba(217,208,180,.3) 0 2px,transparent 2px 9px);pointer-events:none}
#bGas{right:max(22px,env(safe-area-inset-right));bottom:84px;height:112px;min-width:78px;border-color:rgba(217,208,180,.6)}
#bBrk{right:calc(max(22px,env(safe-area-inset-right)) + 96px);bottom:84px;height:84px;min-width:84px;font-size:9px}
#bBrk::before{background:repeating-linear-gradient(90deg,rgba(217,208,180,.28) 0 2px,transparent 2px 9px)}
#bGas:active,#bGas.on,#bBrk:active,#bBrk.on{transform:translateY(4px) scale(.97);background:linear-gradient(rgba(217,208,180,.38),rgba(40,40,36,.8))}
body.drive #bAct{bottom:214px;min-width:84px;width:84px;height:84px;font-size:8.5px;letter-spacing:.07em}
/* Inventar: schlicht, kantig, einfarbig */
#inv{position:fixed;left:50%;bottom:max(6px,env(safe-area-inset-bottom));transform:translateX(-50%);display:none;gap:0;z-index:2;background:rgba(8,9,10,.72);border:1px solid rgba(217,208,180,.28);box-shadow:0 6px 22px rgba(0,0,0,.6)}
.slot{position:relative;width:48px;height:50px;display:flex;align-items:center;justify-content:center;border-right:1px solid rgba(217,208,180,.14);color:var(--bone);transition:background .1s}
.slot:last-child{border-right:0}
.slot svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:.82;margin-top:-6px}
.slot:active{background:rgba(217,208,180,.18)}
.slot.on{background:rgba(217,208,180,.16);box-shadow:inset 0 -2px 0 var(--bone)}.slot.on svg{opacity:1}
.slot b{position:absolute;right:4px;top:3px;font-size:10px;font-weight:600;color:var(--bone);font-variant-numeric:tabular-nums}
.slot small{position:absolute;left:0;right:0;bottom:4px;font-size:6.5px;text-align:center;opacity:.5;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.slot u{position:absolute;left:8px;right:8px;top:5px;height:2px;background:rgba(217,208,180,.18)}.slot u i{display:block;height:100%;background:var(--bone)}
#bSet{right:max(12px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));bottom:auto;min-width:40px;width:40px;height:40px;font-size:17px;letter-spacing:0;opacity:.7;zoom:1}
.btn,#inv{zoom:var(--bs)}
#fps{position:fixed;right:60px;top:12px;font:11px ui-monospace,monospace;color:var(--bone);text-shadow:0 1px 2px #000;display:none;pointer-events:none;z-index:2}
body.photo #hud,body.photo #inv,body.photo .btn,body.photo #cross,body.photo #hint,body.photo #msg{display:none!important}
#photoX{position:fixed;right:18px;top:14px;font-size:22px;opacity:.6;display:none;pointer-events:none;z-index:2}body.photo #photoX{display:block}
#admin{z-index:8;align-items:flex-start;overflow:auto;touch-action:pan-y}
#adminBox{background:#0e1011;border:1px solid rgba(217,208,180,.3);max-width:760px;width:96vw;padding:12px 16px 16px;margin:auto;font-size:12px;touch-action:pan-y}
#adminBox h4{margin:12px 0 6px;font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--bone);opacity:.8;border-top:1px solid rgba(217,208,180,.15);padding-top:9px}
#adminBox h4:first-child{border-top:0;margin-top:0;padding-top:0}
.ar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ab{padding:9px 12px;font-size:11px;letter-spacing:.06em;color:#e8e6df;background:rgba(255,255,255,.05);border:1px solid rgba(217,208,180,.25);border-radius:2px;touch-action:manipulation}
.ab.on{background:rgba(217,208,180,.25);border-color:var(--bone);color:#fff}.ab:active{background:rgba(217,208,180,.35)}
.al{line-height:1.7;font-size:12px}.ad{font-size:26px;letter-spacing:.3em;text-align:center;margin:8px 0 12px;color:var(--bone)}
.ak{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center}.ak .ab{font-size:18px;padding:14px 0}
#stick{position:fixed;width:124px;height:124px;margin:-62px;border-radius:50%;border:1px solid rgba(217,208,180,.3);background:radial-gradient(circle,rgba(10,12,13,.1) 40%,rgba(10,12,13,.45));display:none;pointer-events:none}
#stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:radial-gradient(circle at 50% 32%,rgba(217,208,180,.7),rgba(110,104,84,.5));border:1px solid rgba(217,208,180,.6)}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:6;background:rgba(0,0,0,.74);padding:14px}
#paper{background:#d9d2bd;color:#1c1a22;max-width:440px;width:86vw;max-height:84vh;overflow:auto;padding:24px 26px 18px;transform:rotate(-1.2deg);box-shadow:0 10px 40px #000;font-family:"Segoe Script","Bradley Hand","Comic Sans MS",cursive;font-size:18px;line-height:1.55;white-space:pre-line;touch-action:pan-y}
#paper h3{margin:0 0 10px;font:600 11px system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;opacity:.55}
#paper .x{margin-top:16px;font:11px system-ui,sans-serif;opacity:.5;text-align:right}
#jr{background:#101213;border:1px solid rgba(217,208,180,.25);max-width:520px;width:90vw;max-height:86vh;overflow:auto;padding:18px 20px;font-size:13px;line-height:1.5;touch-action:pan-y}
#jr h2{margin:0 0 4px;font-weight:400;letter-spacing:.2em;font-size:12px;opacity:.7}
#jr .o{font-style:italic;margin:0 0 14px;color:var(--bone)}
#jr .n{border-top:1px solid #2a2e30;padding:9px 0;white-space:pre-line}
#jr .n b{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;margin-bottom:3px}
#jr .sk{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}#jr figure{margin:0;transform:rotate(-1deg)}#jr figure:nth-child(2n){transform:rotate(1.2deg)}#jr canvas{display:block;box-shadow:0 2px 8px #000}#jr figcaption{font:italic 11px "Segoe Script",cursive;opacity:.7;margin-top:3px;text-align:center}
#mapC{max-width:94vw;max-height:92vh;box-shadow:0 10px 40px #000;transform:rotate(.6deg)}
#choice{flex-direction:column;text-align:center}#choice p{font-style:italic;font-size:16px;max-width:520px;line-height:1.5;margin:0 0 12px}
#dead,#end{flex-direction:column;background:#000;text-align:center}
#dead h1{font-weight:300;letter-spacing:.3em;color:#933;font-size:clamp(20px,5vw,40px)}
#end p{font-size:clamp(16px,3.2vw,24px);line-height:1.6;white-space:pre-line;font-style:italic;max-width:680px;transition:opacity 1.2s;min-height:5em}
button.b{margin:6px;padding:13px 34px;font-size:12px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:#efe9d6;border:1px solid rgba(217,208,180,.45);border-radius:2px;background:rgba(14,16,17,.6);transition:transform .08s,background .12s}
button.b:active{transform:scale(.96);background:rgba(217,208,180,.3)}
#bStart{border-color:var(--bone);color:#fff}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(rgba(6,8,10,.7),rgba(0,0,0,.9));z-index:7;text-align:center;padding:20px}
#menu h1{font-weight:300;letter-spacing:.35em;font-size:clamp(26px,6vw,52px);margin:0 0 6px}
#menu p{opacity:.6;max-width:520px;font-size:13px;line-height:1.5;margin:6px 0}
#load{width:240px;height:2px;background:#222;margin:22px 0 14px}#load i{display:block;height:100%;width:0;background:#bbb}
#q{font-size:12px;opacity:.7;padding:8px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fade"></div><div id="flash"></div><canvas id="face"></canvas>
<div class="lb" id="lbT"></div><div class="lb" id="lbB"></div>
<div id="hud">
  <div id="day">Tag 1 · 08:00</div>
  <div class="row"><span class="lbl">Hunger</span><span class="bar"><i id="hHunger"></i></span></div>
  <div class="row"><span class="lbl">Sprit</span><span class="bar"><i id="hFuel"></i></span></div>
  <div id="obj"></div>
</div>
<div id="cross"></div><div id="msg"></div><div id="sub"></div><div id="hint"></div>
<div id="stick"><i></i></div>
<div id="inv"></div>
<div class="btn" id="bAct"></div><div class="btn" id="bFire">Feuer</div><div class="btn" id="bBack">Nach<br>hinten</div><div class="btn" id="bRadio">Radio</div>
<div class="btn" id="bSet">⚙</div><div id="fps"></div><div id="photoX">✕</div>
<div class="btn" id="bGas">GAS</div><div class="btn" id="bBrk">Bremse</div>
<div class="ov" id="note"><div id="paper"></div></div>
<div class="ov" id="journal"><div id="jr"></div></div>
<div class="ov" id="map"><canvas id="mapC" width="1000" height="760"></canvas></div>
<div class="ov" id="choice"><p id="chT"></p><div id="chB"></div></div>
<div class="ov" id="admin"><div id="adminBox"></div></div>
<div class="ov" id="dead"><h1>ER HAT DICH GEFUNDEN</h1><button class="b" id="bRetry">Nochmal</button></div>
<div class="ov" id="end"><p id="endT"></p><button class="b" id="bEnd" style="display:none">Von vorn</button></div>
<div id="menu">
  <h1>LETZTE AUSFAHRT</h1>
  <p id="sub0">Eine kleine Insel. Ein alter Bus. Am Anfang ist noch alles gut.</p>
  <div id="load"><i></i></div>
  <div id="btns" style="display:none">
    <button class="b" id="bStart">Weiter</button><button class="b" id="bNew">Neu beginnen</button><button class="b" id="bNgp" style="display:none">Als Verfolger</button>
    <div id="q">Grafik: <span id="qv">Mittel</span> (tippen zum Ändern)</div>
  </div>
  <p style="margin-top:14px">Links: bewegen / lenken · Rechts: umsehen · Kopfhörer empfohlen</p>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
